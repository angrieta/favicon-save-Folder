<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WebFactory Studio">
  <!-- Favicon de la marque-mère : le Seuil sur une pastille de nuit.
       W ivoire (trait épaissi + agrandi pour tenir à 16px), lune magenta
       (la touche d'accent unique, le ma). -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="#0e1424"/>
  <g transform="translate(32 33) scale(1.12) translate(-32 -32)">
    <path fill="none" stroke="#f2ede3" stroke-width="6.6"
          stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="6"
          d="M16 12 L25 52 L32 30 L39 52 L48 12"/>
    <circle cx="40" cy="24" r="4.2" fill="#e0529c"/>
  </g>
</svg>

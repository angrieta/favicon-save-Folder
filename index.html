<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f1ec">
  <title>브랜드 이미지 레퍼런스</title>
  <link rel="stylesheet" href="app.css?v=2">
</head>
<body>
  <a class="skip-link" href="#library">자료 목록으로 이동</a>

  <header class="masthead">
    <div class="shell">
      <div class="masthead-top">
        <div>
          <h1>브랜드 이미지 레퍼런스</h1>
          <p class="intro">회사 공식 사이트의 배너, 로고, 소셜 이미지와 디자인 참고 자료를 한곳에서 비교하세요.</p>
        </div>
        <button id="theme-toggle" class="quiet-button" type="button" aria-label="색상 테마 변경">다크 모드</button>
      </div>

      <dl id="summary" class="summary" aria-label="수집 현황">
        <div><dt>회사</dt><dd id="summary-brands">-</dd></div>
        <div><dt>이미지</dt><dd id="summary-assets">-</dd></div>
        <div><dt>배너</dt><dd id="summary-banners">-</dd></div>
        <div><dt>로고</dt><dd id="summary-logos">-</dd></div>
      </dl>
    </div>
  </header>

  <div class="control-deck">
    <div class="shell">
      <div class="primary-controls">
        <label class="search-field">
          <span>회사명 또는 키워드 검색</span>
          <input id="search" type="search" placeholder="예: 현대자동차, 여행, 커머스" autocomplete="off">
        </label>

        <label>
          <span>업종</span>
          <select id="category">
            <option value="all">전체 업종</option>
          </select>
        </label>

        <label>
          <span>수집 상태</span>
          <select id="coverage">
            <option value="all">전체 상태</option>
            <option value="complete">배너와 로고 보유</option>
            <option value="missing-banner">배너 없음</option>
            <option value="missing-logo">로고 없음</option>
          </select>
        </label>

        <label>
          <span>정렬</span>
          <select id="sort">
            <option value="assets">이미지 많은 순</option>
            <option value="name">회사명 순</option>
            <option value="category">업종 순</option>
          </select>
        </label>
      </div>

      <div class="type-filter" aria-labelledby="type-filter-label">
        <span id="type-filter-label" class="filter-label">이미지 유형</span>
        <div id="type-buttons" class="type-buttons" role="group" aria-label="이미지 유형 선택"></div>
      </div>
    </div>
  </div>

  <main id="library" class="shell library" tabindex="-1">
    <div class="result-bar">
      <p id="result-count" aria-live="polite">자료를 불러오는 중입니다.</p>
      <button id="reset-filters" class="text-button" type="button" hidden>필터 초기화</button>
    </div>

    <div id="loading-state" class="state-panel" role="status">
      <strong>이미지 목록을 정리하고 있습니다.</strong>
      <span>잠시만 기다려 주세요.</span>
    </div>
    <div id="error-state" class="state-panel state-error" hidden>
      <strong>자료를 불러오지 못했습니다.</strong>
      <span>페이지를 새로고침하거나 로컬 웹 서버에서 열어 주세요.</span>
    </div>
    <div id="empty-state" class="state-panel" hidden>
      <strong>선택한 조건에 맞는 회사가 없습니다.</strong>
      <span>검색어나 필터를 바꿔 보세요.</span>
    </div>
    <section id="brand-grid" class="brand-grid" aria-label="회사별 이미지 자료"></section>
  </main>

  <dialog id="asset-dialog" class="asset-dialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <p id="dialog-category" class="dialog-category"></p>
          <h2 id="dialog-title"></h2>
          <p id="dialog-description" class="dialog-description"></p>
        </div>
        <button id="dialog-close" class="quiet-button" type="button">닫기</button>
      </header>
      <div id="dialog-content" class="dialog-content"></div>
    </div>
  </dialog>

  <script src="app.js?v=2" defer></script>
</body>
</html>
